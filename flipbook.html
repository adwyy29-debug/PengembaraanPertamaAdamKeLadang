<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4e7c9"><title>Pengembaraan Pertama Adam ke Ladang</title>
<style>
:root{--ink:#4d3927;--paper:#fff9e9;--green:#6e914b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#fff9e9 0,#ead9b7 58%,#cdb58e 100%);font-family:Georgia,"Times New Roman",serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:28px 16px 24px}header{text-align:center;margin-bottom:18px}header .eyebrow{font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8a704c}h1{font-size:clamp(25px,4vw,42px);line-height:1.08;margin:7px 0 5px}.subtitle{font:14px system-ui,sans-serif;color:#816d52}.stage{width:min(100%,1000px);perspective:2200px;margin:10px auto 18px}.book{position:relative;width:100%;height:clamp(390px,57vw,590px);display:flex;filter:drop-shadow(0 22px 18px #5c422b45);transform-style:preserve-3d}.book:before{content:"";position:absolute;left:50%;top:1%;height:98%;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,#b89a6e,#fff3d7 38%,#b89a6e 70%,#826545);z-index:8;border-radius:4px;box-shadow:0 0 8px #4a321d55}.leaf{position:absolute;top:0;width:50%;height:100%;background:var(--paper);overflow:hidden;border:1px solid #d6c39e;box-shadow:inset 0 0 24px #a88a5a18}.left{left:0;border-radius:12px 2px 2px 12px;background:linear-gradient(90deg,#e9d9b9 0,#fff9e9 5%,#fff9e9 100%);padding:clamp(18px,4vw,42px) clamp(22px,4vw,48px) clamp(24px,4vw,44px) clamp(26px,5vw,54px)}.right{right:0;border-radius:2px 12px 12px 2px;background:linear-gradient(270deg,#e9d9b9 0,#fff9e9 5%,#fff9e9 100%);padding:clamp(18px,4vw,42px) clamp(26px,5vw,54px) clamp(24px,4vw,44px) clamp(22px,4vw,48px)}.page-content{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}.page-art{width:100%;height:64%;min-height:190px;border-radius:12px;background:linear-gradient(#c9e6ef 0 52%,#b6d38a 52% 72%,#8bad61 72%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 10px #745a3322}.page-art:before{content:"";position:absolute;width:125px;height:125px;border-radius:50%;background:#ffe08a;top:12%;right:12%;box-shadow:0 0 0 12px #ffe08a22}.art-emoji{position:relative;z-index:1;font-family:system-ui,sans-serif;font-size:clamp(68px,11vw,118px);filter:drop-shadow(0 8px 4px #3e573044);letter-spacing:-.16em}.page-content h2{font-size:clamp(20px,2.7vw,29px);margin:0;color:#55733e}.page-content p{font-size:clamp(14px,1.8vw,18px);line-height:1.55;margin:0;max-width:95%}.page-no{font:12px system-ui,sans-serif;color:#a18a67;margin-top:auto}.cover .page-art{height:78%;background:linear-gradient(#9fd0e0 0 48%,#a9cb78 48% 100%)}.cover h2{font-size:clamp(25px,3.5vw,38px);color:#4e6d37}.cover p{font-style:italic}.turning{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:10;transition:transform 850ms cubic-bezier(.2,.72,.18,1);cursor:pointer}.turning.flipped{transform:rotateY(-180deg)}.turn-face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border:1px solid #d6c39e;background:var(--paper);padding:clamp(18px,4vw,42px) clamp(26px,5vw,54px);display:flex;flex-direction:column;border-radius:2px 12px 12px 2px;box-shadow:inset 0 0 24px #a88a5a18}.turn-front{background:linear-gradient(270deg,#e9d9b9 0,#fff9e9 5%,#fff9e9 100%)}.turn-back{transform:rotateY(180deg);background:linear-gradient(90deg,#e9d9b9 0,#fff9e9 5%,#fff9e9 100%);border-radius:12px 2px 2px 12px}.turning .page-content{height:100%}.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font:14px system-ui,sans-serif}button{border:0;border-radius:999px;background:#55733e;color:white;padding:12px 22px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #354c29;transition:transform .15s,opacity .15s}button:hover:not(:disabled){transform:translateY(-2px)}button:disabled{opacity:.38;cursor:not-allowed}.counter{min-width:92px;text-align:center;color:#705b3d;font-weight:700}.hint{font:12px system-ui,sans-serif;color:#826e50;text-align:center;margin-top:13px}.progress{width:min(360px,80vw);height:5px;background:#c9b58f;border-radius:9px;overflow:hidden;margin:15px auto 0}.progress span{display:block;height:100%;background:#6e914b;transition:width .35s}@media(max-width:600px){body{padding:20px 8px}.book{height:420px}.left{padding:15px 13px 18px 16px}.right{padding:15px 16px 18px 13px}.turn-face{padding:15px 16px}.page-art{min-height:155px}.page-content{gap:9px}.page-content p{font-size:13px}.page-content h2{font-size:18px}.art-emoji{font-size:65px}}@media(prefers-reduced-motion:reduce){.turning,.progress span{transition:none}}
</style></head><body>
<header><div class="eyebrow">Buku cerita interaktif</div><h1>Pengembaraan Pertama Adam ke Ladang</h1><div class="subtitle">Selak halaman untuk mengikuti pengembaraan Adam</div></header>
<main class="stage" aria-label="Buku cerita"><div class="book" id="book"><section class="leaf left" id="leftPage" aria-live="polite"></section><section class="leaf right" id="rightPage"></section><div class="turning" id="turning" aria-hidden="true"><div class="turn-face turn-front" id="turnFront"></div><div class="turn-face turn-back" id="turnBack"></div></div></div></main>
<nav class="controls" aria-label="Kawalan halaman"><button id="prev" type="button">← Sebelum</button><span class="counter" id="counter">Kulit buku</span><button id="next" type="button">Seterusnya →</button></nav><div class="progress" aria-hidden="true"><span id="progress"></span></div><p class="hint">Tip: Tekan butang atau klik bahagian kanan buku untuk menyelak halaman.</p>
<script>
const pages=[
{title:"Pengembaraan Pertama Adam ke Ladang",text:"Pada suatu pagi yang cerah, Adam bersiap-siap untuk melawat ladang buat kali pertama. Dia tidak sabar untuk melihat haiwan-haiwan di sana!",art:"👦🏻 🌻 🚜",cover:true},
{title:"Selamat Datang ke Ladang!",text:"“Wah, luasnya ladang ini!” kata Adam. Pak Tani menyambut Adam dan mengajaknya meneroka kawasan ladang.",art:"👨🏻‍🌾 🏡 🌳"},
{title:"Haiwan yang Comel",text:"Adam ternampak lembu, kambing dan ayam. Setiap haiwan mempunyai bunyi dan cara hidup yang berbeza.",art:"🐄 🐐 🐓"},
{title:"Masa Memberi Makan",text:"Adam belajar bahawa haiwan memerlukan makanan yang sesuai dan air bersih setiap hari. Dia membantu Pak Tani mengisi bekas makanan.",art:"🧺 🌾 🐄"},
{title:"Anak Haiwan Sesat",text:"Tiba-tiba, Adam terdengar bunyi anak kambing. Anak kambing itu terpisah daripada ibunya. Adam dan Pak Tani bekerjasama mencarinya.",art:"🐐 💚 🌿"},
{title:"Bersama Semula",text:"Akhirnya, mereka menemui ibu kambing berhampiran pagar. Anak kambing berlari mendapatkannya. Adam berasa gembira kerana dapat membantu!",art:"🐐 🤍 🐐"},
{title:"Pengembaraan yang Menyeronokkan",text:"Sebelum pulang, Adam mengucapkan terima kasih kepada Pak Tani. Hari itu Adam belajar untuk menyayangi haiwan dan menjaga alam sekitar.",art:"👦🏻 🌈 🐄"},
{title:"Tamat",text:"Terima kasih kerana mengikuti pengembaraan pertama Adam ke ladang. Jumpa lagi!",art:"🌻 🐓 🚜",end:true}
];
let current=0,busy=false;const $=id=>document.getElementById(id);
function pageHTML(p,n){return '<div class="page-content '+(p.cover?'cover':'')+'"><div class="page-art"><div class="art-emoji">'+p.art+'</div></div><h2>'+p.title+'</h2><p>'+p.text+'</p><div class="page-no">'+(p.cover?'':p.end?'Tamat':'— '+n+' —')+'</div></div>'}
function paint(){const left=current===0?{title:"",text:"",art:"🌼",cover:true}:pages[current-1];$("leftPage").innerHTML=pageHTML(left,current);$("rightPage").innerHTML=pageHTML(pages[current],current+1);$("counter").textContent=current===0?"Kulit buku":"Halaman "+current+" / "+(pages.length-1);$("prev").disabled=current===0;$("next").disabled=current===pages.length-1;$("progress").style.width=(current/(pages.length-1)*100)+"%";$("turning").classList.remove("flipped")}
function turn(dir){if(busy||(dir>0&&current>=pages.length-1)||(dir<0&&current<=0))return;busy=true;const t=$("turning");if(dir>0){$("turnFront").innerHTML=pageHTML(pages[current],current+1);$("turnBack").innerHTML=pageHTML(pages[current+1],current+2);t.classList.remove("flipped");requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add("flipped")))}else{$("turnFront").innerHTML=pageHTML(pages[current-1],current);$("turnBack").innerHTML=pageHTML(pages[current-2]||pages[0],Math.max(1,current-1));t.classList.add("flipped");requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.remove("flipped")))}current+=dir;$("counter").textContent="Halaman "+current+" / "+(pages.length-1);$("prev").disabled=current===0;$("next").disabled=current===pages.length-1;$("progress").style.width=(current/(pages.length-1)*100)+"%";setTimeout(()=>{paint();busy=false},900)}
$("next").addEventListener("click",()=>turn(1));$("prev").addEventListener("click",()=>turn(-1));$("book").addEventListener("click",e=>{if(e.target.closest("button"))return;const r=$("book").getBoundingClientRect();turn(e.clientX>r.left+r.width/2?1:-1)});document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)});let touchX=0;$("book").addEventListener("touchstart",e=>{touchX=e.changedTouches[0].screenX},{passive:true});$("book").addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45)turn(dx<0?1:-1)},{passive:true});paint();
</script></body></html>
