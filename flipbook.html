<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Pengembaraan Pertama Adam ke Ladang</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
#story{display:block;width:100%;height:100%;border:0;background:#111}
#status{position:fixed;z-index:5;left:50%;top:12px;transform:translateX(-50%);padding:7px 13px;border-radius:20px;background:#fff9e9e8;color:#4d3927;font:600 12px system-ui,sans-serif;box-shadow:0 2px 10px #0003;transition:opacity .5s}
#status.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="status">Memuatkan buku cerita Adam…</div>
<iframe id="story" src="index.html" title="Pengembaraan Pertama Adam ke Ladang"></iframe>
<script>
(function(){
  var frame=document.getElementById('story');
  var status=document.getElementById('status');
  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      var img=doc.getElementById('stageImg');
      var stage=doc.getElementById('stage');
      if(!img||!stage) throw new Error('Komponen buku cerita tidak ditemui');
      var nativeSrc=Object.getOwnPropertyDescriptor(doc.defaultView.HTMLImageElement.prototype,'src');
      var style=doc.createElement('style');
      style.textContent=
        '#stageImg{transform-origin:left center;backface-visibility:hidden;transform-style:preserve-3d}'+
        '.page-turn-sheet{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:100;pointer-events:none;transform-origin:left center;backface-visibility:hidden;animation:adamPageTurn 720ms cubic-bezier(.55,.08,.35,1) both;box-shadow:12px 0 28px #0008}'+
        '@keyframes adamPageTurn{0%{transform:perspective(1500px) rotateY(0deg);filter:brightness(1)}45%{transform:perspective(1500px) rotateY(-82deg);filter:brightness(.72)}100%{transform:perspective(1500px) rotateY(-180deg);filter:brightness(.6)}}'+
        '@media(prefers-reduced-motion:reduce){.page-turn-sheet{animation-duration:1ms}}';
      doc.head.appendChild(style);
      Object.defineProperty(img,'src',{
        configurable:true,
        enumerable:true,
        get:function(){return nativeSrc.get.call(this)},
        set:function(value){
          var oldValue=this.getAttribute('src');
          if(oldValue && oldValue!==value){
            var sheet=doc.createElement('img');
            sheet.className='page-turn-sheet';
            sheet.alt='';
            nativeSrc.set.call(sheet,oldValue);
            stage.appendChild(sheet);
            sheet.addEventListener('animationend',function(){if(sheet.parentNode)sheet.parentNode.removeChild(sheet)});
            doc.defaultView.setTimeout(function(){if(sheet.parentNode)sheet.parentNode.removeChild(sheet)},900);
          }
          nativeSrc.set.call(this,value);
        }
      });
      status.classList.add('hide');
    }catch(err){
      status.textContent='Buku cerita dimuatkan tanpa kesan halaman.';
      doc && console.warn(err);
    }
  });
})();
</script>
</body>
</html>
